services:
  - type: web
    name: munim
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: munim-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: AI_STUB
        value: "0"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: PINELABS_MODE
        value: stub
      - key: AGENT_MODE
        value: builtin
      - key: AGENT_API_KEY
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: TZ
        value: Asia/Kolkata

databases:
  - name: munim-db
    plan: free
